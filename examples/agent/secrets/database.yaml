# YAML modes must be quoted so leading zeroes survive parsing.
path: servers/web01/database-password
template: database.templ
destination: /etc/myapp/database.conf
owner: root
group: root
mode: "0600"
# Optional argv array. Only local configuration can specify this command.
# The executable must be absolute. The hook runs after a successful file write.
# command: ["/usr/bin/systemctl", "try-restart", "myapp.service"]
command_timeout: 30s
